<!DOCTYPE html>

<html lang="en" xml:lang="en" xmlns="http://www.w3.org/1999/xhtml">

<head>
    <title>WepSIM</title>
    <meta name="Description" content="The Web Elemental Processor SIMulator (WepSIM) for microprogramming and assembly programming" />

    <meta http-equiv="cache-control" content="max-age=0" />
    <meta http-equiv="cache-control" content="no-cache" />
    <meta http-equiv="expires" content="0" />
    <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
    <meta http-equiv="pragma" content="no-cache" />

    <meta charset="utf-8" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="msapplication-tap-highlight" content="no" />
    <meta name="viewport" content="user-scalable=yes, width=device-width, initial-scale=1, maximum-scale=2.5, minimum-scale=.5" />

    <link rel="shortcut icon" href="images/icons/favicon.ico" />
    <link rel="mask-icon"     href="images/icons/safari-pinned-tab.svg" color="#5bbad5" />

    <style>
    @keyframes spinner-border {
        to { transform: rotate(360deg); }
    }
    </style>
</head>


<body>

    <noscript>Your browser does not support JavaScript!</noscript>

    <span id="ws_loader" class="collapse show">
	<table id="tbl_loader" style="width:100%; height:100%; position:fixed; background-color: white;  z-index:100;">
	<tr>
	<td align="center">
            <div role="status"
                 style="display:inline-block;
                        width:2.5em;
                        height:2.5em;
                        border:0.30em solid #198754;
                        border-right-color:transparent;
                        border-radius:50%;
                        animation:spinner-border .75s linear infinite;">
              <span style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;">
                Loading...
              </span>
            </div>

	    <br/><br/>
            <span style="color:#0d6efd !important; font-weight:700 !important; font-family:Verdana, Arial, sans-serif;">
            <h3><span data-langkey='Loading WepSIM...'>Loading WepSIM...</span></h3>
            </span>
	</td>
	</tr>
	</table>
    </span>


<script type="text/javascript">
    try
    {
	    // (1/2) get_cfg('ws_skin_dark_mode') ...
            var optValue = localStorage.getItem('wepsim_ws_skin_dark_mode') ;

            // update background for dark_mode if 'on' or 'auto' and 'prefers-color-scheme: dark'
            var isDarkMode = false ;
            switch (optValue)
            {
               case 'on':   isDark = true ;
                            break ;
               case 'auto': isDark = window.matchMedia('(prefers-color-scheme: dark)').matches ;
                            break ;
            }

            if (isDarkMode) {
                document.body.style.background = 'black' ;
                document.getElementById('tbl_loader').style.background = 'black' ;
            }

	    // (2/2) get_cfg('ws_skin_ui') ...
            var optValue = localStorage.getItem('wepsim_ws_skin_ui') ;

            // redirect to wepsim-classic, wepsim-compact, etc.
            window.location='ws_dist/wepsim-' + optValue + '.html' ;
    }
    catch(err)
    {
          alert("Please try to cleanup the browser cache and try again (just in case).\n" +
		"\n" +
                "WepSIM was improperly used:\n" + err.message + "\n" +
		"\n" +
		"More details:\n" + err.stack) ;
    }
</script>

</body>

</html>
